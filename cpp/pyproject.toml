# Empaqueta el núcleo C++ como módulo de Python (`import jacobi_nativo`).
#   pip install .            (o: uv pip install .)
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "jacobi-nativo"
version = "2.0.0"
description = "Núcleo en C++23 del método de Jacobi por bloques (CSR), expuesto con nanobind"
readme = "readme.md"
requires-python = ">=3.11"
authors = [{ name = "Carlos Maceira Garcia Coni" }]
dependencies = ["numpy>=1.26"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"  # wheel con ABI estable cuando Python >= 3.12

[tool.scikit-build.cmake.define]
JACOBI_BUILD_PYTHON = "ON"
JACOBI_BUILD_TESTS = "OFF"
JACOBI_BUILD_CLI = "OFF"
