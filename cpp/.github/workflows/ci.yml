name: CI

on:
  push:
  pull_request:

jobs:
  cpp:
    name: C++ (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  python:
    name: Módulo Python (nanobind)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install . numpy
      - run: python -c "import numpy as np, jacobi_nativo as j; x,*_ = j.resolver_bloque(np.array([0,1]), np.array([0]), np.array([2.0]), 0, np.array([4.0]), np.zeros(1)); assert x[0] == 2.0"
